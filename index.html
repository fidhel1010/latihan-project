<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Boxicons CSS -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
     
    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">

</head>
<body>
    
    <div class="profile-card" tabindex="0">
        <div class="image">
            <img src="profile.png" alt="Profile Image" class="profile-img">
        </div>

        <div class="text-data">
            <span class="name">Fidhel Mulya</span>
            <span class="job">Full Stack - Web Developer</span>
        </div>

        <div class="media-button">
            <a href="#" style="background: linear-gradient( 45deg,#ffdc80 0%, #feda75 10%,#fcaf45 20%,#fa7e1e 30%,#f77737 40%,#f56040 50%,#fd1d1d 60%,#e1306c 70%,#c13584 80%,#833ab4 90%,#405de6 100%);" class="link">
                <i class='bx bxl-instagram-alt'></i>
            </a>
            <a href="#" style="background: #1877F2;" class="link">
                <i class='bx bxl-facebook'></i>
            </a>
            <a href="#" style="background: #CD201F;" class="link">
                <i class='bx bxl-youtube'></i>
            </a>
            <a href="#" style="background: #5865F2;" class="link">
                <i class='bx bxl-discord-alt'></i>
            </a>
        </div>

        <div class="btn-container">
            <button type="button" class="button">Follow</button>
            <button type="button" class="button">Message</button>
        </div>

        <div class="analystics">
            <div class="data">
                <i class="bx bx-heart"></i>
                <span class="number">60k</span>
            </div>

            <div class="data">
                <i class="bx bx-message"></i>
                <span class="number">20k</span>
            </div>

            <div class="data">
                <i class="bx bx-share"></i>
                <span class="number">12k</span>
            </div>
        </div>
    </div>
 
</body>
</html>
